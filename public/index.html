<!doctype html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

	<title>Calidad</title>

	<!-- PWA -->
	<link rel="manifest" href="/manifest.json" />
	<meta name="theme-color" content="#0f766e" />

	<!-- Loader mínimo (UX controlada, no pantalla blanca) -->
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			background: #0f766e;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}

		/* SOLO estado pre-SPA */
		#app:empty {
			display: flex;
			align-items: center;
			justify-content: center;
			color: white;
			text-align: center;
			height: 100%;
		}

		/* Cuando Vue monta, el layout pasa a la SPA */
		#app {
			height: 100%;
		}
	</style>
</head>

<body>
	<!-- ROOT REAL DE LA SPA -->
	<div id="app">
		<p>Cargando aplicación…</p>
	</div>

	<!-- Registro del Service Worker (pasivo, no bloqueante) -->
	<script>
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('/service-worker.js')
				.catch(() => { });
		}
	</script>

	<!-- ENTRY REAL DE VITE (SIN LÓGICA EXTRA) -->
	<script type="module" src="/frontend/main.js"></script>

</body>

</html>
