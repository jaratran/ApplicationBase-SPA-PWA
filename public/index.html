<!doctype html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

	<title>Calidad</title>

	<!-- PWA -->
	<link rel="manifest" href="/manifest.json" />
	<meta name="theme-color" content="#0f766e" />

	<!-- Loader mínimo (UX controlada, no pantalla blanca) -->
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: #0f766e;
		}

		#app {
			min-height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			color: white;
			text-align: center;
		}
	</style>
</head>

<body>
	<!-- ROOT REAL DE LA SPA -->
	<div id="app">
		<p>Cargando aplicación…</p>
	</div>

	<!-- Registro del Service Worker (pasivo, no bloqueante) -->
	<script>
		// if ('serviceWorker' in navigator) {
		// 	navigator.serviceWorker.register('/service-worker.js')
		// 		.catch(() => { });
		// }

		async function enableHighPriorityOffline() {
			// 1. Solicitar persistencia de disco (Flag persistente en Chrome)
			// Esto le dice a Chrome: "No borres este caché aunque falte espacio"
			if (navigator.storage && navigator.storage.persist) {
				const isPersisted = await navigator.storage.persist();
				console.log(`[Storage] ¿Persistencia garantizada?: ${isPersisted}`);
			}

			// 2. Registrar el "despertador" (Periodic Sync)
			const registration = await navigator.serviceWorker.ready;

			if ('periodicSync' in registration) {
				// OPCIONAL: Solo intentar si la PWA está instalada (evita ruidos en consola)
				const status = await navigator.permissions.query({
					name: 'periodic-background-sync',
				});

				if (status.state === 'granted') {
					try {
						// Registramos una tarea mínima para elevar la prioridad del SW en el runtime
						await registration.periodicSync.register('pwa-keep-alive', {
							minInterval: 24 * 60 * 60 * 1000
						});
						console.log('[PeriodicSync] Registro de prioridad exitoso');
					} catch (error) {
						// Nota: Esto requiere que la PWA esté instalada para funcionar
						console.warn('[PeriodicSync] No se pudo registrar (normal si no está instalada)');
					}
				}
			}
		}

		if ('serviceWorker' in navigator) {
			// REGISTRO: Con updateViaCache para ignorar la red en el arranque post-reboot
			navigator.serviceWorker.register('/service-worker.js', {
				updateViaCache: 'all'
			}).catch(err => console.error("SW Registration failed", err));

			// EJECUCIÓN: Cuando el SW toma control, elevamos su estatus a "Prioritario"
			navigator.serviceWorker.ready.then(enableHighPriorityOffline);
		}
	</script>

	<!-- ENTRY REAL DE VITE (SIN LÓGICA EXTRA) -->
	<script type="module" src="/frontend/main.js"></script>

</body>

</html>
