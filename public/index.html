<!doctype html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

	<title>Calidad</title>

	<!-- PWA -->
	<link rel="manifest" href="/manifest.json" />
	<meta name="theme-color" content="#0f766e" />

	<!-- Estilo mínimo para bootstrap -->
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: #0f766e;
			color: white;
		}

		#bootstrap {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100%;
			text-align: center;
		}
	</style>
</head>

<body>
	<!-- BOOTSTRAP -->
	<div id="bootstrap">
		<p>Cargando aplicación…</p>
	</div>

	<!-- APP ROOT -->
	<div id="app" style="display:none"></div>

	<!-- index.html bootstrap registra el Service Worker -->
	<script>
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('/service-worker.js')
				.catch(err => console.warn('[SW] register failed', err))
		}
	</script>

	<script>
		/**
		 * BOOTSTRAP PWA-FIRST — RELEASE
		 * --------------------------------
		 * Garantiza:
		 * - index.html SIEMPRE carga
		 * - El SW toma control del documento
		 * - La SPA se monta SOLO bajo control del SW
		 */

		const BOOTSTRAP_FLAG = '__pwa_bootstrap_reload__'

		function startApp() {
			document.getElementById('bootstrap').style.display = 'none'
			document.getElementById('app').style.display = 'block'

			const script = document.createElement('script')
			script.type = 'module'
			script.src = '/frontend/main.js'
			document.body.appendChild(script)
		}

		if ('serviceWorker' in navigator) {
			// Caso ideal: ya estamos controlados
			if (navigator.serviceWorker.controller) {
				startApp()
			} else {
				// SW activo pero aún no controla este documento
				navigator.serviceWorker.ready.then(() => {
					// Evitar loop infinito
					if (!sessionStorage.getItem(BOOTSTRAP_FLAG)) {
						sessionStorage.setItem(BOOTSTRAP_FLAG, '1')
						location.reload()
					}
				})

				// Backup: cuando finalmente tome control
				navigator.serviceWorker.addEventListener('controllerchange', () => {
					startApp()
				})
			}
		} else {
			// Fallback extremo (navegadores sin SW)
			startApp()
		}
	</script>

</body>

</html>
