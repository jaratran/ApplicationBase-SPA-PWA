<!doctype html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<title>Calidad · Sin conexión</title>

	<!-- Si hay conexión, redirigir inmediatamente al entry real -->
	<script>
		if (navigator.onLine) {
			location.replace('/');
		}
	</script>

	<style>
		body {
			margin: 0;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: #0f766e;
			color: white;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			text-align: center;
		}

		.box {
			max-width: 420px;
			padding: 2rem;
		}

		h1 {
			margin-bottom: 0.5rem;
			font-size: 1.4rem;
		}

		p {
			opacity: 0.9;
			margin-bottom: 1.5rem;
		}

		button {
			background: white;
			color: #0f766e;
			border: none;
			border-radius: 6px;
			padding: 0.6rem 1.2rem;
			font-size: 1rem;
			cursor: pointer;
		}
	</style>
</head>

<body>
	<div class="box">
		<h1>Sin conexión</h1>
		<p>La aplicación se abrirá automáticamente cuando vuelva la conectividad.</p>
		<button onclick="location.reload()">Reintentar</button>
	</div>
</body>

</html>
